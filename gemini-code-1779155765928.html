let score = 0;
let answeredCount = 0;

// Hàm khởi tạo và hiển thị đề thi
function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((item, index) => {
        const quizItem = document.createElement('div');
        quizItem.className = 'quiz-item';
        quizItem.id = `quiz-q-${index}`;

        // Xác định màu badge độ khó
        let badgeClass = 'bg-lythuyet';
        if(item.type === 'de') badgeClass = 'bg-de';
        if(item.type === 'trungbinh') badgeClass = 'bg-trungbinh';
        if(item.type === 'kho') badgeClass = 'bg-kho';

        quizItem.innerHTML = `
            <div class="question-title">
                <span class="badge ${badgeClass}">${item.label}</span> Câu ${index + 1}: ${item.question}
            </div>
            <ul class="options-list">
                ${item.options.map((opt, optIdx) => `
                    <li class="option-box" onclick="checkAnswer(${index}, ${optIdx}, this)">${opt}</li>
                `).join('')}
            </ul>
            <div class="explanation-box" id="explain-${index}">
                <div class="explanation-title">💡 Giải thích chi tiết:</div>
                <div>${item.explain}</div>
                <div class="tip-box">🚀 Mẹo làm nhanh: ${item.tip}</div>
            </div>
        `;
        container.appendChild(quizItem);
    });

    // Kích hoạt MathJax quét lại để kết xuất công thức toán
    if (window.MathJax && window.MathJax.typeset) {
        window.MathJax.typeset();
    }
}

// Hàm kiểm tra đáp án khi người dùng click
function checkAnswer(qIdx, optIdx, element) {
    const currentQuestion = quizData[qIdx];
    const parent = element.parentElement;
    const options = parent.querySelectorAll('.option-box');
    const explainBox = document.getElementById(`explain-${qIdx}`);

    // Vô hiệu hóa click lại các phương án khác trong câu này
    options.forEach(opt => opt.classList.add('disabled'));

    if (optIdx === currentQuestion.answer) {
        // Nếu trả lời đúng
        element.classList.add('correct');
        score += 5; // Mỗi câu 5 điểm, tổng 100 điểm
    } else {
        // Nếu trả lời sai
        element.classList.add('incorrect');
        // Hiển thị luôn đáp án đúng cho người dùng thấy
        options[currentQuestion.answer].classList.add('correct');
    }

    // Hiển thị khối lời giải và mẹo
    explainBox.style.display = 'block';
    
    // Cập nhật điểm và tiến độ
    answeredCount++;
    document.getElementById('answered-count').innerText = answeredCount;
    document.getElementById('current-score').innerText = score;

    // Cập nhật lại định dạng công thức toán trong khối giải thích vừa hiển thị
    if (window.MathJax && window.MathJax.typeset) {
        window.MathJax.typeset();
    }
}

// Hàm bổ trợ: Tự động tải file HTML hiện tại về máy
function downloadCurrentFile() {
    const htmlContent = document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'Trac_Nghiem_Tuong_Tac_AI_Matran.html';
    link.click();
}

// Gọi hàm chạy ban đầu
window.onload = renderQuiz;
